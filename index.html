<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>予定管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f4f6fa;color:#171717}
header{padding:22px 22px 14px;background:white;border-bottom:1px solid #eee;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:28px} .date{color:#666;margin-top:6px}
main{padding:16px 16px 100px;max-width:720px;margin:auto}
.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #00000008}
.card h2{margin:0 0 12px;font-size:21px}
.item{padding:14px 0;border-top:1px solid #eee}.item:first-child{border-top:0}
.muted{color:#777}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:5px 10px;font-size:12px;margin-right:6px}
button{border:0;border-radius:14px;padding:12px 16px;font-size:15px;background:#222;color:white}
button.secondary{background:#eef0f4;color:#222}button.danger{background:#fff0f0;color:#b00020}
.fab{position:fixed;right:22px;bottom:76px;width:60px;height:60px;border-radius:50%;font-size:32px;padding:0;z-index:8}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:7}
nav button{background:none;color:#555;padding:8px 18px}.active{font-weight:700;color:#111!important}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}
.sheet{background:white;border-radius:24px 24px 0 0;padding:22px;width:100%;max-height:92vh;overflow:auto}
label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px;background:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:20px}.actions>*{flex:1}
.small{font-size:13px}.empty{padding:16px 0;color:#777}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>📅 予定管理</h1><div class="date" id="todayLabel"></div></header>
<main id="app"></main>
<button class="fab" onclick="openAdd()">＋</button>
<nav>
<button id="navToday" class="active" onclick="showPage('today')">🏠<br>今日</button>
<button id="navSchedule" onclick="showPage('schedule')">🗓️<br>予定</button>
<button id="navTask" onclick="showPage('task')">✅<br>タスク</button>
</nav>

<div class="modal" id="modal">
<div class="sheet">
<h2>予定・勉強タスクを追加</h2>
<label>種類</label>
<select id="kind" onchange="toggleKind()"><option value="event">予定</option><option value="study">勉強・タスク</option></select>

<div id="eventFields">
<label>予定名</label><input id="title" placeholder="例：テスト、文化祭バンド">

<label>期間</label>
<div class="row"><input id="startDate" type="date"><input id="endDate" type="date"></div>

<label>時間（任意）</label>
<div class="row"><input id="startTime" type="time"><input id="endTime" type="time"></div>
<p class="muted small">同じ日なら「18:00〜20:00」のように指定できます。時間を空欄にすると終日の予定です。</p>
</div>

<div id="studyFields" class="hidden">
<label>タスク名</label><input id="studyTitle" placeholder="例：英単語帳を覚える">
<label>期限</label><input id="deadline" type="date">
<label>合計勉強時間（分）</label><input id="totalMinutes" type="number" min="1" value="300">
<label>勉強できる期間</label><div class="row"><input id="studyStart" type="date"><input id="studyEnd" type="date"></div>
<label>1日あたりの上限（任意・分）</label><input id="dailyMax" type="number" min="1" placeholder="例：45">
<p class="muted small">期限までの期間に自動で分散し、「今日やること」に毎日の勉強時間を作ります。</p>
</div>

<div class="actions"><button class="secondary" onclick="closeModal()">キャンセル</button><button onclick="saveItem()">追加する</button></div>
</div></div>

<script>
const KEY="scheduleAppCleanV2";
let data={events:[],tasks:[]};
try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");data.events=x.events||[];data.tasks=x.tasks||[];}catch(e){}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const today=()=>iso(new Date());
document.getElementById("todayLabel").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});

function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function fmtDate(s){if(!s)return "";const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}/${d.getDate()}`;}
function openAdd(){
 document.getElementById("modal").style.display="flex";
 const t=today(); for(const id of ["startDate","endDate","studyStart"]){document.getElementById(id).value=t}
 document.getElementById("deadline").value=t;document.getElementById("studyEnd").value=t;
}
function closeModal(){document.getElementById("modal").style.display="none";}
function toggleKind(){
 const study=document.getElementById("kind").value==="study";
 document.getElementById("eventFields").classList.toggle("hidden",study);
 document.getElementById("studyFields").classList.toggle("hidden",!study);
}
function daysBetween(a,b){
 let A=new Date(a+"T00:00:00"),B=new Date(b+"T00:00:00");
 return Math.max(1,Math.floor((B-A)/86400000)+1);
}
function distribute(total,start,end,maxPerDay){
 const n=daysBetween(start,end), out=[];
 let remaining=Number(total);
 for(let i=0;i<n;i++){
   const d=new Date(start+"T00:00:00"); d.setDate(d.getDate()+i);
   const daysLeft=n-i;
   let mins=Math.ceil(remaining/daysLeft);
   if(maxPerDay) mins=Math.min(mins,Number(maxPerDay));
   if(i===n-1) mins=remaining;
   if(mins>0){out.push({date:iso(d),minutes:mins});remaining-=mins;}
 }
 if(remaining>0 && out.length) out[out.length-1].minutes+=remaining;
 return out;
}
function saveItem(){
 const kind=document.getElementById("kind").value;
 if(kind==="event"){
   const title=document.getElementById("title").value.trim();
   const start=document.getElementById("startDate").value,end=document.getElementById("endDate").value||start;
   if(!title||!start){alert("予定名と開始日を入力してね");return}
   if(end<start){alert("終了日は開始日以降にしてね");return}
   data.events.push({id:Date.now(),title,startDate:start,endDate:end,startTime:document.getElementById("startTime").value,endTime:document.getElementById("endTime").value});
 }else{
   const title=document.getElementById("studyTitle").value.trim(), deadline=document.getElementById("deadline").value;
   const start=document.getElementById("studyStart").value||today(), end=document.getElementById("studyEnd").value||deadline;
   const total=Number(document.getElementById("totalMinutes").value);
   if(!title||!deadline||!total){alert("タスク名・期限・勉強時間を入力してね");return}
   const s=start>deadline?deadline:start, e=end>deadline?deadline:end;
   const parts=distribute(total,s,e,document.getElementById("dailyMax").value);
   const taskId=Date.now();
   data.tasks.push({id:taskId,title,deadline,totalMinutes:total,planned:parts,done:[]});
 }
 save();closeModal();render();showPage("today");
}
function eventOnDate(e,d){return e.startDate<=d&&d<=e.endDate}
function taskForDate(t,d){return (t.planned||[]).find(x=>x.date===d)}
function completeTask(tid,date){
 const t=data.tasks.find(x=>x.id===tid); if(!t)return;
 t.done=t.done||[]; const i=t.done.indexOf(date); if(i>=0)t.done.splice(i,1);else t.done.push(date);save();render();
}
function deleteEvent(id){if(confirm("この予定を削除する？")){data.events=data.events.filter(x=>x.id!==id);save();render();}}
function deleteTask(id){if(confirm("このタスクを削除する？")){data.tasks=data.tasks.filter(x=>x.id!==id);save();render();}}
function renderToday(){
 const d=today();let html=`<div class="card"><h2>今日やること</h2>`;
 const todaysTasks=[];
 data.tasks.forEach(t=>{const p=taskForDate(t,d);if(p)todaysTasks.push({t,p})});
 if(!todaysTasks.length)html+=`<div class="empty">今日のタスクはありません。＋から追加できます。</div>`;
 todaysTasks.forEach(({t,p})=>{const done=(t.done||[]).includes(d);html+=`<div class="item"><b>${t.title}</b><div><span class="pill">勉強 ${p.minutes}分</span><span class="pill">期限 ${fmtDate(t.deadline)}</span></div><button class="secondary" onclick="completeTask(${t.id},'${d}')">${done?"↩ 未完了に戻す":"✓ 今日の分を完了"}</button></div>`});
 html+=`</div><div class="card"><h2>今日の予定</h2>`;
 const ev=data.events.filter(e=>eventOnDate(e,d));
 if(!ev.length)html+=`<div class="empty">今日の予定はありません。</div>`;
 ev.forEach(e=>html+=`<div class="item"><b>${e.title}</b><div class="muted">${fmtDate(e.startDate)}〜${fmtDate(e.endDate)} ${e.startTime?e.startTime+"〜"+(e.endTime||""):"終日"}</div><button class="danger small" onclick="deleteEvent(${e.id})">削除</button></div>`);
 html+=`</div><div class="card"><h2>マネージャーから</h2><p>予定を期間・時間つきで入れると、ここで毎日の予定と勉強量を整理できます💪</p></div>`;
 document.getElementById("app").innerHTML=html;
}
function renderSchedule(){
 let html=`<div class="card"><h2>これからの予定</h2>`;
 const ev=[...data.events].sort((a,b)=>a.startDate.localeCompare(b.startDate));
 if(!ev.length)html+=`<div class="empty">予定はまだありません。</div>`;
 ev.forEach(e=>html+=`<div class="item"><b>${e.title}</b><div>${fmtDate(e.startDate)}〜${fmtDate(e.endDate)}　${e.startTime?e.startTime+"〜"+(e.endTime||""):"終日"}</div><button class="danger small" onclick="deleteEvent(${e.id})">削除</button></div>`);
 html+=`</div>`;document.getElementById("app").innerHTML=html;
}
function renderTask(){
 let html=`<div class="card"><h2>勉強・タスク</h2>`;
 if(!data.tasks.length)html+=`<div class="empty">タスクはまだありません。</div>`;
 data.tasks.forEach(t=>{const done=(t.done||[]).length;html+=`<div class="item"><b>${t.title}</b><div>期限 ${fmtDate(t.deadline)}　合計 ${t.totalMinutes}分</div><div class="muted small">毎日の予定：${(t.planned||[]).map(p=>fmtDate(p.date)+" "+p.minutes+"分").join(" / ")}</div><button class="danger small" onclick="deleteTask(${t.id})">削除</button></div>`});
 html+=`</div>`;document.getElementById("app").innerHTML=html;
}
function render(){const page=window.currentPage||"today"; if(page==="today")renderToday();else if(page==="schedule")renderSchedule();else renderTask();}
function showPage(p){window.currentPage=p;document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById("nav"+p[0].toUpperCase()+p.slice(1)).classList.add("active");render();}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body></html>
